<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Products</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <main class="page">
    <header class="page-header">
      <h1>Products</h1>
      <button type="button" class="btn btn-secondary" id="loadBtn">Load products</button>
    </header>

    <section class="panel" aria-labelledby="list-title">
      <h2 id="list-title">Product list</h2>
      <ul id="list" class="product-list" aria-live="polite"></ul>
      <p id="empty" class="empty">No products loaded. Select "Load products" to see them.</p>
    </section>

    <section class="panel" aria-labelledby="add-title">
      <h2 id="add-title">Add product</h2>
      <form id="addForm" class="add-form" novalidate>
        <div class="field">
          <label for="name">Name</label>
          <input id="name" name="name" placeholder="e.g. Wireless mouse" autocomplete="off" required>
        </div>
        <div class="field">
          <label for="price">Price ($)</label>
          <input id="price" name="price" type="number" min="0" step="0.01" placeholder="0.00" inputmode="decimal" required>
        </div>
        <button type="submit" class="btn btn-primary">Add product</button>
      </form>
      <p id="message" class="message" role="status"></p>
    </section>
  </main>

  <script src="./client.js"></script>
  <script>
    const list = document.getElementById('list');
    const empty = document.getElementById('empty');
    const message = document.getElementById('message');
    const loadBtn = document.getElementById('loadBtn');
    const form = document.getElementById('addForm');

    function showMessage(text, type) {
      message.textContent = text;
      message.className = 'message ' + (type || '');
    }

    async function loadProducts() {
      loadBtn.disabled = true;
      try {
        const products = await getProducts();
        list.innerHTML = '';
        products.forEach(p => {
          const li = document.createElement('li');
          li.className = 'product';

          const id = document.createElement('span');
          id.className = 'product-id';
          id.textContent = '#' + p.id;

          const name = document.createElement('span');
          name.className = 'product-name';
          name.textContent = p.name;

          const price = document.createElement('span');
          price.className = 'product-price';
          price.textContent = '$' + Number(p.price).toFixed(2);

          li.append(id, name, price);
          list.appendChild(li);
        });
        empty.hidden = products.length > 0;
        empty.textContent = 'No products yet. Add one below.';
      } catch (err) {
        showMessage('Could not load products. Check the server and try again.', 'error');
      } finally {
        loadBtn.disabled = false;
      }
    }

    async function addProduct() {
      const name = document.getElementById('name').value.trim();
      const priceValue = document.getElementById('price').value;
      const price = Number(priceValue);

      if (!name || priceValue === '' || isNaN(price) || price < 0) {
        showMessage('Enter a name and a valid price.', 'error');
        return;
      }

      try {
        await createProduct({ name, price });
        form.reset();
        showMessage('Product added.', 'success');
        loadProducts();
      } catch (err) {
        showMessage('Could not add the product. Try again.', 'error');
      }
    }

    loadBtn.addEventListener('click', loadProducts);
    form.addEventListener('submit', e => {
      e.preventDefault();
      addProduct();
    });
  </script>
</body>
</html>
